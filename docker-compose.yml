services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/web/.env
    environment:
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/admin/.env
    environment:
      NODE_OPTIONS: "--max-old-space-size=96"
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/space/.env
    environment:
      NODE_OPTIONS: "--max-old-space-size=96"
    depends_on:
      - api
      - web

  api:
    image: oneflow-api:latest
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://plane-redis:6379/1}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    image: oneflow-worker:latest
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://plane-redis:6379/1}"
      CELERY_WORKERS: "${CELERY_WORKERS:-1}"
      CELERY_MAX_TASKS_PER_CHILD: "50"
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  migrator:
    image: oneflow-migrator:latest
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/live/.env
    environment:
      PORT: "${PORT:-3000}"
      API_BASE_URL: "${API_BASE_URL:-http://api:8000}"
      REDIS_HOST: "${REDIS_HOST:-plane-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      LIVE_SERVER_SECRET_KEY: "${LIVE_SERVER_SECRET_KEY:-secret-key}"
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      plane-redis:
        condition: service_healthy
      api:
        condition: service_started

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=30' -c 'shared_buffers=32MB' -c 'effective_cache_size=128MB' -c 'work_mem=2MB' -c 'maintenance_work_mem=16MB' -c 'min_wal_size=32MB' -c 'max_wal_size=128MB'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-plane} -d $${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    command: valkey-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Reverse proxy gateway
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      FILE_SIZE_LIMIT: "${FILE_SIZE_LIMIT:-5242880}"
      BUCKET_NAME: "${AWS_S3_BUCKET_NAME:-uploads}"
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
