services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/web/.env
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/admin/.env
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/space/.env
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      AMQP_URL: "${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      AMQP_URL: "${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}"
      CELERY_WORKERS: "${CELERY_WORKERS:-2}"
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      AMQP_URL: "${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}"
      AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}"
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/live/.env
    environment:
      PORT: "${PORT:-3000}"
      API_BASE_URL: "${API_BASE_URL:-http://api:8000}"
      REDIS_HOST: "${REDIS_HOST:-plane-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_URL: "${REDIS_URL:-redis://plane-redis:6379/}"
      LIVE_SERVER_SECRET_KEY: "${LIVE_SERVER_SECRET_KEY:-secret-key}"
    depends_on:
      - plane-redis
      - api

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=200'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

  # Reverse proxy gateway
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      FILE_SIZE_LIMIT: "${FILE_SIZE_LIMIT:-5242880}"
      BUCKET_NAME: "${AWS_S3_BUCKET_NAME:-uploads}"
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
